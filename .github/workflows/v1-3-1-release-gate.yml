name: V1.3.1 release gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify generated configuration
        run: npm run check:config
      - name: Run complete regression
        run: npm test
      - name: Run community tests
        run: npm run test:community
      - name: Require V1.3.1 source
        run: |
          node -e "const p=require('./package.json');if(!p.version.startsWith('1.3.1'))process.exit(1)"
          test -s public/masahatak.html
          test -s public/masahatak.js
          test -s public/community-admin.html
          test -s netlify/functions/community.mjs
