<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المجتمع | ميك أب هاوس</title><style>
*{box-sizing:border-box}body{margin:0;background:#fbf4f5;color:#442c38;font:16px/1.8 Tahoma,Arial,sans-serif}main{max-width:900px;margin:auto;padding:24px}h1{font-size:26px}.panel,article{background:white;border:1px solid #e8d5dc;border-radius:16px;padding:18px;margin:15px 0}button,input{font:inherit;border-radius:9px;padding:10px;border:1px solid #cdb3c0}button{background:#78364f;color:white;cursor:pointer;margin:4px}button.secondary{background:white;color:#78364f}input{width:min(100%,420px)}.muted{color:#786a72;font-size:13px}.error{color:#9c1734}.post{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#78364f}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style></head><body><main><header><h1>إدارة مجتمعنا</h1><a href="/admin.html">العودة إلى مركز الإدارة</a></header><p>النشر فوري بعد التحقق الآلي. راجع البلاغات وأخفِ المشاركات المخالفة أو أعد إظهارها. هذه لوحة تجريبية.</p><section class="panel"><label for="password">كلمة مرور المدير</label><div><input id="password" type="password" autocomplete="current-password" placeholder="كلمة مرور الإدارة"><button id="load">عرض المشاركات والبلاغات</button></div><p id="status" role="status"></p></section><section id="items" aria-live="polite"></section></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),api='/.netlify/functions/community';let password='';
function node(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}
async function call(action,body){const r=await fetch(api+'?action='+encodeURIComponent(action),{method:body?'POST':'GET',headers:{'x-admin-password':password,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'فشل الطلب');return data}
async function load(){const status=$('status');status.textContent='جارٍ التحميل...';$('items').replaceChildren();try{const data=await call('admin-list');status.textContent='عدد المشاركات: '+data.items.length;for(const p of data.items){const card=node('article'),title=node('strong',p.kind+' — '+(p.status==='approved'?'منشورة':p.status==='pending'?'بانتظار المراجعة':'مخفية')),txt=node('p',p.text,'post'),meta=node('p','البلاغات: '+(data.reports[p.id]||0)+' | '+p.createdAt,'muted'),button=node('button',p.status==='approved'?'إخفاء المشاركة':'إظهار المشاركة');button.className=p.status==='approved'?'':'secondary';button.onclick=async()=>{if(!confirm('تأكيد تغيير ظهور المشاركة؟'))return;button.disabled=true;try{await call('moderate',{id:p.id,status:p.status==='approved'?'rejected':'approved'});await load()}catch(e){status.textContent=e.message;button.disabled=false}};card.append(title,txt,meta,button);$('items').append(card)}if(!data.items.length)$('items').append(node('p','لا توجد مشاركات حاليًا'))}catch(e){status.textContent=e.message;status.className='error'}}
$('load').onclick=()=>{password=$('password').value;$('password').value='';if(!password)return $('status').textContent='أدخل كلمة مرور المدير';load()};})();
</script></body></html>
