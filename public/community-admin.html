<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مراجعة مجتمعنا</title><style>body{font:16px Tahoma,Arial;background:#faf2f2;color:#58384b;margin:25px auto;max-width:700px;padding:0 15px}article{background:white;padding:18px;border-radius:15px;margin:15px 0;border:1px solid #ead9df}button,input{font:inherit;padding:10px;margin:5px;border-radius:10px;border:1px solid #d9c5d1}button{background:#8b486a;color:white;cursor:pointer}p{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>إدارة مجتمعنا</h1><p>لوحة لإخفاء المشاركات المخالفة وإعادة إظهارها. لا تنشر كلمة مرور الإدارة في أي رابط.</p><input id="password" type="password" placeholder="كلمة مرور الإدارة" autocomplete="off"><button id="load">عرض المشاركات</button><button id="clear" type="button">مسح كلمة المرور</button><p id="status"></p><div id="items"></div><script>const $=id=>document.getElementById(id);$('clear').onclick=()=>{$('password').value='';$('items').replaceChildren();$('status').textContent='تم مسح كلمة المرور من الصفحة'};$('load').onclick=async()=>{const pass=$('password').value;if(!pass){$('status').textContent='أدخل كلمة مرور الإدارة أولًا';return;} $('status').textContent='جارٍ تحميل المشاركات...';let r;try{r=await fetch('/.netlify/functions/community?action=admin-list',{headers:{'x-admin-password':pass},cache:'no-store'});}catch{$('status').textContent='تعذر الاتصال بالخادم';return;}const j=await r.json().catch(()=>({}));if(!r.ok){$('status').textContent=(j.error||'تعذر الوصول')+(r.status===503?' — تحقق من إعدادات STAGING_DB و DEPLOYMENT_ENV و ADMIN_PASSWORD و RATE_LIMIT_SALT في Cloudflare.':'');return}$('status').textContent='عدد السجلات: '+j.items.length;$('items').replaceChildren();for(const p of j.items){const a=document.createElement('article'),h=document.createElement('strong'),t=document.createElement('p');h.textContent=p.kind+' | '+p.status+' | بلاغات: '+(j.reports?.[p.id]||0);t.textContent=p.text;a.append(h,t);for(const status of ['approved','rejected']){const b=document.createElement('button');b.textContent=status==='approved'?'إعادة الإظهار':'إخفاء المشاركة';b.disabled=p.status===status;b.onclick=async()=>{if(status==='rejected'&&!confirm('إخفاء هذه المشاركة من العرض العام؟'))return;let r;try{r=await fetch('/.netlify/functions/community?action=moderate',{method:'POST',headers:{'content-type':'application/json','x-admin-password':$('password').value},body:JSON.stringify({id:p.id,status})});}catch{alert('تعذر الاتصال بالخادم');return;}const j=await r.json().catch(()=>({}));if(r.ok)$('load').click();else alert(j.error||'فشل')};a.append(b)}$('items').append(a)}};</script></html>
