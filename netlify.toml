# GENERATED by tools/build-config.mjs — do not edit by hand.
# Deploy with Git or the Netlify CLI so this file is honoured (see docs/DEPLOYMENT-GUIDE-V1.2.1.md).
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Defence in depth: if the project root were ever published by mistake, these stay private.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/tools/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/index.html"
  status = 404
  force = true

# Public site
[[headers]]
  for = "/"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-Oa68vaYpOBMPZEwbFJTDITUhIxWiZ/u/YvnzLbtBIso=' 'sha256-5G1Phs45qxdA/30uIMjfYY1TFKTlCrzKtsLMLdvO/mY='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"

